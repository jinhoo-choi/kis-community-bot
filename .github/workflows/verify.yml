name: verify-keys

# 등록한 키가 실제로 동작하는지 확인한다.
# 비밀값은 레포에 남기지 않는다.
#   - 레포 커밋(data/verify.txt): ok/fail 과 마스킹된 값만
#   - chat_id 전체 값: Actions 요약(Job Summary)에만 출력 → 커밋되지 않음

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: 'TELEGRAM_CHAT_ID 로 테스트 메시지 발송'
        type: boolean
        default: false
      chat_suffix:
        description: '테스트 발송할 chat_id 뒤 4자리 (시크릿 미등록 시 사용)'
        type: string
        default: ''


permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Telegram getMe
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          mkdir -p data
          : > data/verify.txt
          if [ -z "$TG" ]; then
            echo "TELEGRAM_TOKEN   : 미등록" | tee -a data/verify.txt
            exit 0
          fi
          curl -s "https://api.telegram.org/bot${TG}/getMe" -o /tmp/me.json
          python3 tools/verify_helper.py getme | tee -a data/verify.txt

      - name: Telegram getUpdates (chat_id 조회)
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          [ -z "$TG" ] && exit 0
          curl -s "https://api.telegram.org/bot${TG}/getWebhookInfo" -o /tmp/wh.json
          python3 tools/verify_helper.py webhook | tee -a data/verify.txt
          # offset 을 주지 않아야 대기 중 업데이트가 소비되지 않는다
          curl -s "https://api.telegram.org/bot${TG}/getUpdates?limit=100&timeout=0" -o /tmp/u.json
          python3 tools/verify_helper.py updates | tee -a data/verify.txt

      - name: Telegram sendMessage (suffix 매칭 발송)
        if: ${{ inputs.chat_suffix != '' }}
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_SUFFIX: ${{ inputs.chat_suffix }}
        run: |
          CID=$(python3 tools/verify_helper.py resolve)
          if [ -z "$CID" ]; then
            echo "SUFFIX 매칭      : FAIL 해당 chat 없음 (getUpdates 24h 만료 가능)" | tee -a data/verify.txt
            exit 0
          fi
          # ※ 여러 줄 문자열을 YAML 블록 스칼라에 직접 넣으면 들여쓰기가 깨져
          #   워크플로 파일 자체가 무효화된다. 메시지는 파일로 만들어 전달한다.
          python3 tools/verify_helper.py testmsg > /tmp/msg.txt
          R=$(curl -s -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
                -d "chat_id=${CID}" -d "parse_mode=HTML" \
                --data-urlencode "text@/tmp/msg.txt")
          OK=$(echo "$R" | python3 -c "import json,sys;print(json.load(sys.stdin).get('ok'))")
          echo "SUFFIX 발송      : $([ "$OK" = "True" ] && echo OK || echo FAIL)  ...${CID: -4}" | tee -a data/verify.txt
          [ "$OK" = "True" ] || echo "$R" | head -c 200

      - name: Telegram sendMessage (시크릿 발송)
        if: ${{ inputs.send_test }}
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
          CID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$CID" ]; then
            echo "TELEGRAM_CHAT_ID : 미등록" | tee -a data/verify.txt; exit 0
          fi
          R=$(curl -s -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
                -d "chat_id=${CID}" \
                --data-urlencode "text=[kis-community-bot] 연결 테스트 성공")
          OK=$(echo "$R" | python3 -c "import json,sys;print(json.load(sys.stdin).get('ok'))")
          echo "TELEGRAM_CHAT_ID : $([ "$OK" = "True" ] && echo OK || echo FAIL)" | tee -a data/verify.txt
          [ "$OK" = "True" ] || echo "$R" | head -c 300

      - name: DART
        env:
          K: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$K" ]; then echo "DART_API_KEY     : 미등록" | tee -a data/verify.txt; exit 0; fi
          D=$(date -d "yesterday" +%Y%m%d)
          R=$(curl -s "https://opendart.fss.or.kr/api/list.json?crtfc_key=${K}&bgn_de=${D}&end_de=${D}&page_count=10")
          echo "$R" > /tmp/dart.json
          python3 tools/verify_helper.py dart | tee -a data/verify.txt

      - name: Anthropic
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$K" ]; then echo "ANTHROPIC_KEY    : 미등록" | tee -a data/verify.txt; exit 0; fi
          C=$(curl -s -o /tmp/a.json -w "%{http_code}" https://api.anthropic.com/v1/messages \
            -H "x-api-key: $K" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
            -d '{"model":"claude-haiku-4-5-20251001","max_tokens":8,"messages":[{"role":"user","content":"ping"}]}')
          E=$(python3 -c "import json;d=json.load(open('/tmp/a.json'));print((d.get('error') or {}).get('message','')[:80])" 2>/dev/null)
          echo "ANTHROPIC_KEY    : $([ "$C" = "200" ] && echo OK || echo "FAIL($C) $E")" | tee -a data/verify.txt

      - name: Gemini
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$K" ]; then echo "GEMINI_KEY       : 미등록" | tee -a data/verify.txt; exit 0; fi
          C=$(curl -s -o /tmp/g.json -w "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent" \
            -H "x-goog-api-key: $K" -H "content-type: application/json" \
            -d '{"contents":[{"parts":[{"text":"ping"}]}]}')
          E=$(python3 -c "import json;d=json.load(open('/tmp/g.json'));print((d.get('error') or {}).get('message','')[:80])" 2>/dev/null)
          echo "GEMINI_KEY       : $([ "$C" = "200" ] && echo OK || echo "FAIL($C) $E")" | tee -a data/verify.txt

      - name: Summary & commit
        if: always()
        run: |
          echo "## 키 검증 결과" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat data/verify.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat data/verify.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/verify.txt
          git diff --staged --quiet || git commit -m "chore: verify keys $(date +%FT%H%M)"
          git pull --rebase -q origin main || true
          git push
