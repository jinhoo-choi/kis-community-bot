name: daily-posts

on:
  schedule:
    # 주 경로는 외부 cron 이 매 영업일 KST 08:00 에 workflow_dispatch 로
    # 호출한다(auto_schedule=true). GitHub schedule 은 지연이 크다
    # (실측: +114분, 예정 시각에 아예 안 들어온 날도 있음).
    # 이것은 외부 cron 이 실패한 날을 위한 예비다. UTC 23:40 = KST 08:40.
    # 08:00 실행이 성공했으면 아래 가드가 이 실행을 건너뛴다.
    - cron: '40 23 * * 0-4'
  workflow_dispatch:
    inputs:
      test_mode:
        description: '테스트 채널로 발송 (TELEGRAM_TEST_CHAT_ID)'
        type: boolean
        default: true
      test_chat_suffix:
        description: '임시: 테스트 chat_id 뒤 4자리 (시크릿 미등록 시)'
        type: string
        default: ''
      ignore_seen:
        description: '반복 테스트: 과거 중복 이력 무시 (상태 저장 안 함)'
        type: boolean
        default: false
      use_batch:
        description: 'Batch API 사용 (50건 이상일 때만 권장)'
        type: choice
        options: ['auto', '0', '1']
        default: 'auto'
      target_posts:
        description: '배포 건수 (비우면 50)'
        type: string
        default: ''
      auto_schedule:
        description: '외부 cron 정기 실행 표시 (같은 날 이미 돌았으면 건너뜀)'
        type: boolean
        default: false
      refresh_market:
        description: '시세 캐시를 무시하고 새로 수집 (수급 API 검증용)'
        type: boolean
        default: false
      dry_run:
        description: '수집만 실행 (LLM/텔레그램 호출 없음)'
        type: boolean
        default: false

permissions:
  contents: write

# 정기 실행과 수동 실행이 겹치면 같은 글을 중복 전송하고 state push도 충돌한다.
concurrency:
  group: daily-posts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # 스케줄러 지연이 크다(실측: #121 +114분, #122 는 예정 시각에 안 들어와
      # 수동 실행했다). 그 사이 수동 실행으로 그날 물량을 이미 내보냈는데
      # 지연된 정기 실행이 뒤늦게 들어오면 같은 날 두 번 발송된다.
      # 실측 2026-09-15: #122 수동 50건 발송 22분 뒤 #123 정기 실행이 50건을
      # 더 내보내 담당자에게 하루 100건이 갔다(비용 $2.79).
      # 직전 실행 기록(run_stats.jsonl 은 매 실행이 커밋한다)의 날짜가 오늘이면
      # 정기 실행은 건너뛴다. 수동 실행은 의도된 것이므로 건너뛰지 않는다.
      - name: Skip if already run today
        id: guard
        env:
          TZ: Asia/Seoul
        run: |
          # 정기 실행(외부 cron 08:00, GitHub 예비 08:40)만 가드한다.
          # 사람이 누른 수동 실행은 의도된 것이라 건너뛰지 않는다.
          if [ "${{ github.event_name }}" != "schedule" ] && \
             [ "${{ inputs.auto_schedule }}" != "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 테스트 실행 기록은 빼고 '실채널로 나간 마지막 실행' 날짜를 본다.
          LAST=$(python3 -c "
          import json
          last=''
          for l in open('data/run_stats.jsonl', encoding='utf-8'):
              try:
                  r=json.loads(l)
              except Exception:
                  continue
              if not r.get('test_mode') and r.get('sent', 0) > 0:
                  last=r['ts'][:10]
          print(last)" 2>/dev/null || echo "")
          TODAY=$(date +%F)
          if [ "$LAST" = "$TODAY" ]; then
            echo "::warning::오늘 $TODAY 이미 실행됨 — 지연된 정기 실행을 건너뛴다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests
        id: tests
        if: steps.guard.outputs.skip != 'true' 
        run: |
          mkdir -p data
          set -o pipefail
          ./run_tests.sh 2>&1 | tee data/test_report.txt

      - name: Generate & distribute
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          # 유료 잔액 소진 시 사용할 별도 무료 티어 프로젝트 키(같은 결제계정 키 금지)
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          # 테스트 전용 키. 등록돼 있으면 test_mode 실행에서 이쪽을 쓴다.
          ANTHROPIC_API_KEY_TEST: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
          GEMINI_API_KEY_TEST:    ${{ secrets.GEMINI_API_KEY_TEST }}
          GEMINI_FREE_API_KEY_TEST: ${{ secrets.GEMINI_FREE_API_KEY_TEST }}
          DART_API_KEY:      ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          TELEGRAM_TEST_CHAT_SUFFIX: ${{ inputs.test_chat_suffix }}
          REFRESH_MARKET: ${{ inputs.refresh_market && '1' || '0' }}
          TEST_MODE:             ${{ inputs.test_mode && '1' || '0' }}
          USE_BATCH:             ${{ inputs.use_batch || 'auto' }}
          IGNORE_SEEN:           ${{ inputs.ignore_seen && '1' || '0' }}
          CLAUDE_MODEL:      ${{ vars.CLAUDE_MODEL || 'claude-haiku-4-5-20251001' }}
          CLAUDE_BACKUP_JUDGE_MODEL: ${{ vars.CLAUDE_BACKUP_JUDGE_MODEL || 'claude-sonnet-5' }}
          GEMINI_MODEL:      ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          GEMINI_JUDGE_MODEL: ${{ vars.GEMINI_JUDGE_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_FREE_MODEL: ${{ vars.GEMINI_FREE_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_FREE_MIN_INTERVAL: ${{ vars.GEMINI_FREE_MIN_INTERVAL || '5.0' }}
          GEMINI_HTTP_TIMEOUT_SEC: ${{ vars.GEMINI_HTTP_TIMEOUT_SEC || '30' }}
          ENABLE_ENRICH:     ${{ vars.ENABLE_ENRICH || '1' }}
          ENABLE_JUDGE:      ${{ vars.ENABLE_JUDGE || '1' }}
          MIN_JUDGE_SCORE:   ${{ vars.MIN_JUDGE_SCORE || '14' }}
          MIN_FACTUAL_SCORE: ${{ vars.MIN_FACTUAL_SCORE || '4' }}
          MIN_COMPLIANT_SCORE: ${{ vars.MIN_COMPLIANT_SCORE || '4' }}
          MAX_PER_STOCK:     ${{ vars.MAX_PER_STOCK || '2' }}
          TARGET_POSTS:      ${{ inputs.target_posts || vars.TARGET_POSTS || '50' }}
          TZ: Asia/Seoul
        id: pipeline
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p data
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -u main.py --dry-run 2>&1 | tee data/dryrun_report.txt
          else
            # 실행 로그를 파일로 남긴다. Actions 로그는 외부 호스트로 리다이렉트되어
            # 접근이 어려우므로 실패 원인을 레포에서 확인할 수 있어야 한다.
            python -u main.py 2>&1 | tee data/run_log.txt
          fi

      - name: Commit reports
        if: ${{ always() && inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dryrun_report.txt data/test_report.txt || true
          git diff --staged --quiet || git commit -m "chore: dry-run report $(date +%FT%H%M)"
          # 다른 실행·사람이 같은 순간에 push 하면 non-fast-forward 로 죽는다
          # (실측 2026-09-13: dry-run·verify 의 Commit 단계가 이 사유로 실패).
          # 상태 커밋이 실패하면 발송 이력이 저장되지 않아 다음 날 중복 발송 위험이 있다.
          for i in 1 2 3; do
            git pull --rebase -q origin main || true
            git push && break
            echo "push 재시도 $i"
            sleep $((i * 5))
          done

      # filter_log 는 실행마다 새 파일이 생겨 레포에 무한 축적됐다 (37개).
      # 커밋 대신 아티팩트로 남긴다 — 품질 검토는 사후 1회면 충분하다.
      - name: Upload filter_log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: filter-log-${{ github.run_id }}
          path: data/filter_log_*.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail if any step failed
        if: ${{ always() && (steps.tests.outcome == 'failure' || steps.pipeline.outcome == 'failure') }}
        run: exit 1

      - name: Commit state
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/run_stats.jsonl 2>/dev/null || true
          # 보강 캐시를 커밋해야 다음 실행이 그라운딩을 다시 하지 않는다
          git add -f data/enrich_cache.json 2>/dev/null || true
          # 상장사 목록 캐시. KIND 403 시 이게 없으면 종목 귀속이 무너진다
          git add -f data/listed_cache.json 2>/dev/null || true
          # 지정일 일별시세로 만든 확정 캐시. 다음 장전 실행의 2,600회 재조회를 줄인다
          git add -f data/market_cache.json 2>/dev/null || true
          git add -f data/test_report.txt || true
          git add -f data/posts_latest.json data/run_log.txt || true
          git diff --staged --quiet || git commit -m "chore: update state $(date +%F)"
          # 다른 실행·사람이 같은 순간에 push 하면 non-fast-forward 로 죽는다
          # (실측 2026-09-13: dry-run·verify 의 Commit 단계가 이 사유로 실패).
          # 상태 커밋이 실패하면 발송 이력이 저장되지 않아 다음 날 중복 발송 위험이 있다.
          for i in 1 2 3; do
            git pull --rebase -q origin main || true
            git push && break
            echo "push 재시도 $i"
            sleep $((i * 5))
          done
