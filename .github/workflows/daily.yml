name: daily-posts

on:
  schedule:
    # UTC 21:00 = KST 익일 06:00 / 월~금 배포 (일~목 UTC 실행)
    - cron: '0 21 * * 0-4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '수집만 실행 (LLM/텔레그램 호출 없음)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: ./run_tests.sh

      - name: Generate & distribute
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          DART_API_KEY:      ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_MODEL:      ${{ vars.CLAUDE_MODEL || 'claude-haiku-4-5-20251001' }}
          GEMINI_MODEL:      ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          GEMINI_JUDGE_MODEL: ${{ vars.GEMINI_JUDGE_MODEL || 'gemini-3.1-flash-lite' }}
          ENABLE_ENRICH:     ${{ vars.ENABLE_ENRICH || '1' }}
          ENABLE_JUDGE:      ${{ vars.ENABLE_JUDGE || '1' }}
          MIN_JUDGE_SCORE:   ${{ vars.MIN_JUDGE_SCORE || '14' }}
          MAX_PER_STOCK:     ${{ vars.MAX_PER_STOCK || '2' }}
          TZ: Asia/Seoul
        run: python main.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/run_stats.jsonl
          git diff --staged --quiet || git commit -m "chore: update state $(date +%F)"
          git push
